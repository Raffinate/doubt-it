<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doubt It: play vs AI</title>
    <meta
      name="description"
      content="Play Doubt It, the classic bluffing card game with a revolver twist, against GTO-trained AI solvers or a friend in your browser. Free, no download."
    />
    <meta property="og:title" content="Doubt It: play vs solver" />
    <meta
      property="og:description"
      content="Play Doubt It against GTO-trained AI solvers. Challenge eight AI archetypes, or play a friend online."
    />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='9' y='3' width='17' height='24' rx='3' fill='%231e3a8a' transform='rotate(12 17 15)'/%3E%3Crect x='5' y='5' width='17' height='24' rx='3' fill='%23fff' stroke='%23334155' stroke-width='1.5'/%3E%3Ctext x='13.5' y='22' font-family='Georgia,serif' font-size='13' font-weight='700' text-anchor='middle' fill='%23b91c1c'%3EK%3C/text%3E%3C/svg%3E"
    />
    <script>
      // Same "theme" key and values as the raffinate.github.io blog, so the choice carries across.
      // Runs before first paint to avoid a flash of the wrong theme.
      try {
        const t = localStorage.getItem("theme")
        document.documentElement.dataset.theme =
          t === "light" || t === "dark" ? t : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"
      } catch {
        document.documentElement.dataset.theme = "dark"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
